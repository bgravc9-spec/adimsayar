name: ADIM SAYAR - APK Derle

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android platformunu yukle
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android Studio Gradle Wrapper olustur
        run: gradle --no-daemon wrapper --gradle-version 8.13

      - name: Debug APK derle
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: APK dosyasini sun
        uses: actions/upload-artifact@v4
        with:
          name: ADIM-SAYAR-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Android Studio icin eksiksiz proje ZIP'i olustur
        run: |
          zip -r ADIM_SAYAR_ANDROID_STUDIO_HAZIR.zip \
            app/src app/build.gradle.kts app/proguard-rules.pro \
            gradle .github README.md PRIVACY.md \
            settings.gradle.kts build.gradle.kts gradle.properties \
            .gitignore gradlew gradlew.bat

      - name: Android Studio proje ZIP'ini sun
        uses: actions/upload-artifact@v4
        with:
          name: ADIM-SAYAR-AndroidStudio-Kaynak
          path: ADIM_SAYAR_ANDROID_STUDIO_HAZIR.zip
          if-no-files-found: error
          retention-days: 30
